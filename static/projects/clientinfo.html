<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js" integrity="sha384-Akqfrbj/HpNVo8k11SXBb6TlBWmXXlYQrCSqEWmyKJe+hDm3Z/B2WVG4smwBkRVm" crossorigin="anonymous"></script>
    <meta name="htmx-config" content='{"selfRequestsOnly":false, "defaultSwapStyle":"textContent"}'>
    <title>IPFY</title>
</head>
<body>
    <div hx-request='{"noHeaders": true}'>
        <h1>What's my IP address?</h1>
        <button  hx-get="https://api.ipify.org" hx-trigger='click' hx-target="#ipv4" hx-indicator="#spinner">
            IPv4?
        </button>
        <button  hx-get="https://api6.ipify.org" hx-trigger='click' hx-target="#ipv6" hx-indicator="#spinner">
            IPv6?
        </button>
         <button  hx-get="https://wttr.in/?format=4" hx-trigger='click' hx-target="#weather" hx-indicator="#spinner">
            Weather?
        </button>
    </div>
    <img  id="spinner" class="htmx-indicator" src="https://htmx.org/img/bars.svg"/>
    <div id="ipv4"></div>
    <div id="ipv6"></div>
    <div id="weather"></div>
</body>
</html>
